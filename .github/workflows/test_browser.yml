name: Lint and Test Browser
on:
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'pnpm'
      - run: pnpm --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test-browser